<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TUFA AutoSales ERP</title>
<meta name="theme-color" content="#0b5c6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Import dhe shitje automjetesh: blerje nga fleta doganore me skanim, kosto, shitje, kontratë dhe raporte.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column built for the phone; summary first, then the list; forms follow the order of the customs sheet. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --ink:#14232b; --muted:#5d6d76; --line:#d5dce0;
  --accent:#0b5c6b; --accent-ink:#ffffff; --tint:#dcebee;
  --good:#1f7a4d; --warn:#a8620a; --bad:#b3372f;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f171b; --surface:#18242a; --ink:#e6eef1; --muted:#93a4ac; --line:#2a3a42;
    --accent:#4fb6c6; --accent-ink:#06262c; --tint:#1d3238;
    --good:#5fc592; --warn:#e0a44a; --bad:#ef7d73; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f171b; --surface:#18242a; --ink:#e6eef1; --muted:#93a4ac; --line:#2a3a42;
  --accent:#4fb6c6; --accent-ink:#06262c; --tint:#1d3238;
  --good:#5fc592; --warn:#e0a44a; --bad:#ef7d73; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px}
#app.wide #lbody{width:min(1320px,calc(100vw - 56px));align-self:center}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:800;letter-spacing:.2px}
h2{font-size:19px;font-weight:700}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);letter-spacing:.3px}
.muted{color:var(--muted)}
.small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand span{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font:700 19px/1.2 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{font-size:12px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 4px;border-bottom:1px solid var(--line)}
.tabs button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:600 14px var(--body);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.car{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.car.sold{border-left-color:var(--good)}
.car .name{font:700 17px var(--display)}
.car .amt{font:700 16px var(--display);text-align:right;font-variant-numeric:tabular-nums}
.car .sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.car .sub.r{text-align:right}
.cosel{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cosel::-webkit-scrollbar{display:none}
.cosel button{appearance:none;flex:none;font:600 13px var(--body);padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cosel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font:600 11.5px var(--body);padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.stock{color:var(--warn)} .pill.sold{color:var(--good)} .pill.bad{color:var(--bad)} .pill.ok{color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:12px;color:var(--muted)}
input,select{font:400 16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input.auto,select.auto{background:var(--tint);border-color:var(--accent)}
input:focus-visible,select:focus-visible,button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;flex:none;margin-top:1px}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14.5px var(--body);padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:none}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1 1 140px;min-width:0}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv div:last-child{border-bottom:0}
.kv div span:last-child{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.kv div.total{border-top:2px solid var(--ink);border-bottom:0;font:700 17px var(--display);padding-top:10px;margin-top:2px}
.kv div.off span{color:var(--muted);text-decoration:line-through}
.scan{border:2px dashed var(--accent);background:var(--tint);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:9px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.big{font:800 26px/1.15 var(--display);font-variant-numeric:tabular-nums}
.fab{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);display:flex;justify-content:center;pointer-events:none}
.fab .btn{pointer-events:auto;width:100%;max-width:728px;padding:14px;font-size:16px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
table.numbered th:nth-child(2),table.numbered td:nth-child(2){text-align:left}table.numbered td:first-child{color:var(--muted)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
#toast{position:fixed;left:16px;right:16px;bottom:84px;margin:0 auto;max-width:520px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;display:none;z-index:5}
.spin{width:16px;height:16px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.carrow{display:flex;gap:8px;align-items:stretch}.carrow .car{flex:1;min-width:0}.carrow .btn{flex:none}
.paper{background:#fff;color:#16181a;border:1px solid var(--line);border-radius:4px;padding:22px 20px;font-size:13.5px;line-height:1.5;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.paper h4{margin:6px 0 0;font:700 13.5px var(--body)}.paper p{margin:0}.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px;text-align:center}
input[type=search]::-webkit-search-cancel-button{display:none}
#qx{position:absolute;right:4px;top:50%;transform:translateY(-50%);appearance:none;border:0;background:none;color:var(--muted);font:400 24px/1 var(--body);width:38px;height:38px;border-radius:50%;cursor:pointer}#qx:hover{color:var(--ink);background:var(--tint)}#qx[hidden]{display:none}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:6;margin-top:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:230px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sugg div{padding:8px 10px;cursor:pointer}.sugg div.on{background:var(--accent);color:var(--accent-ink)}
.datebtn{appearance:none;display:flex;align-items:center;gap:10px;width:100%;font:500 16px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;text-align:left}
.datebtn:hover{border-color:var(--accent)}.datebtn svg{flex:none;color:var(--accent)}
.datebox{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:text}.datebox:hover{border-color:var(--accent)}.datebox:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.datebox input{border:0;background:none;outline:none;padding-left:4px;font-weight:500}.datebox button{appearance:none;border:0;background:none;padding:9px 6px 9px 10px;color:var(--accent);cursor:pointer;display:flex}
.cal{position:absolute;z-index:7;right:0;top:100%;margin-top:4px;width:296px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:8px}
.cal .hd{display:flex;align-items:center;justify-content:space-between;font:700 15px var(--display)}
.cal .hd button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;width:36px;height:34px;font-size:18px;cursor:pointer}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .g span{font-size:11.5px;color:var(--muted);padding:2px 0}
.cal .g button{appearance:none;border:1px solid transparent;background:none;color:var(--ink);font:500 14.5px var(--body);height:36px;border-radius:8px;cursor:pointer;font-variant-numeric:tabular-nums}
.cal .g button:hover{background:var(--tint)}.cal .g button.today{border-color:var(--accent)}
.cal .g button.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.exp{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.exp button{appearance:none;border:0;background:none;color:var(--bad);font:600 13px var(--body);cursor:pointer;padding:4px 6px}
.logo-wrap{display:flex;justify-content:center;padding:4px 0}
.logo-wrap img{display:block;width:min(230px,60vw);height:auto}
/* Logoja është blu e errët: në pamjen e errët i vihet një sfond i çelët që të lexohet. */
@media (prefers-color-scheme: dark){.logo-wrap{background:#eef1f3;border-radius:14px;padding:10px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  let s=String(v??'').replace(/\s/g,'');if(!s)return 0;
  if(s.includes(',')&&s.includes('.'))s=s.replace(/,/g,'');
  else if(s.includes(','))s=/,\d{3}(,|$)/.test(s)?s.replace(/,/g,''):s.replace(',','.');
  const n=parseFloat(s);return isFinite(n)?n:0;
}
const fmt=(n,d=0)=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const lek=n=>fmt(n)+' L';
const dmy=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?`${m[3]}.${m[2]}.${m[1]}`:(s||'')};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const VAT_SALE=0.20;

const S={view:'list',tab:'stock',id:null,vehicles:[],loaded:false,slow:false,db:null,sample:null,imgLimits:null,
  boa:null,cal:{open:false,y:0,m:0},q:'',rep:{year:String(new Date().getFullYear()),month:'',mode:null},settings:{default_pct:'',sellers:{}},draft:null,auto:new Set(),scan:{busy:false,msg:'',err:''},confirmDel:false};

// Kursi zyrtar i Bankës së Shqipërisë, i ruajtur te rates/boa. Nuk përdoret kur është më i vjetër se 5 ditë.
function boaAge(){const b=S.boa;if(!b||!/^\d{4}-\d{2}-\d{2}$/.test(b.date||''))return 99;return Math.round((new Date(today())-new Date(b.date))/864e5)}
function boaRate(code){const b=S.boa,r=b&&b.rates&&num(b.rates[code]);return r>0&&boaAge()<=5?r:0}
function calc(v){
  const purchase=num(v.invoice_value)*(v.currency==='ALL'?1:num(v.rate));
  const freight=num(v.freight_all),duty=num(v.duty),vat=num(v.vat),other=num(v.other_fees);
  const exp=(v.expenses||[]).reduce((a,e)=>a+num(e.amount),0);
  const vatInCost=v.vat_deductible===false?vat:0;
  const cost=purchase+freight+duty+other+vatInCost+exp;
  const p=v.pricing||{};
  const own=p.value!==''&&p.value!==undefined&&p.value!==null,std=num(S.settings.default_pct);
  const usesStd=p.mode!=='val'&&!own&&std>0;
  const markup=p.mode==='val'?num(p.value):cost*(own?num(p.value):std)/100;
  const price=cost+markup;
  const sold=v.status==='sold';
  const salePrice=sold?num(v.sale&&v.sale.price):0;
  return {purchase,freight,duty,vat,other,exp,vatInCost,cost,markup,price,priceVat:price*(1+VAT_SALE),
    salePrice,profit:sold?salePrice-cost:0,customsPaid:duty+vat+other,customsCost:duty+other,taxBase:num(v.tax_base)||(v.source==='local'?purchase:num(v.customs_value)+duty),usesStd,sold};
}

/* ---------- storage ---------- */
const LS='autosales.vehicles';
function loadLocal(){try{S.vehicles=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){S.vehicles=[]}try{S.settings=Object.assign({default_pct:'',sellers:{}},JSON.parse(localStorage.getItem(LSS)||'{}'))}catch(e){}try{S.boa=JSON.parse(localStorage.getItem('autosales.boa')||'null')}catch(e){}}
const queues={};
/* Abonimi (vetëm kur programi rri në server): pas afatit kompania mbetet vetëm për lexim. */
function subDays(){const e=S.sub&&S.sub.expires_on;if(!e)return null;const a=new Date(e+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.round((a-n)/864e5)}
function subExpired(){if(S.viewAs)return true;const d=subDays();return d!==null&&d<0}
/* Administratori që ka hapur kompaninë e një klienti (?shiko=…): sheh gjithçka, nuk ndryshon asgjë. Serveri e refuzon shkrimin gjithsesi. */
const VIEW_RO='Po e sheh si administrator: vetëm për lexim.';
const roMsg=()=>S.viewAs?VIEW_RO:SUB_RO;
const SUB_CONTACT='<a href="https://tufa.al" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">tufa.al</a> ose <a href="tel:+355696052163" style="color:var(--accent);font-weight:600;white-space:nowrap">+355 69 605 2163</a>';
const SUB_RO='Abonimi ka skaduar. Programi është vetëm për lexim.';
function subBanner(){
  if(S.view==='login')return '';
  return (S.viewAs?`<div class="card small" style="border-color:var(--accent);background:var(--tint)"><div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap"><span><b>Administrator · po sheh llogarinë e klientit${S.viewAs.name?' “'+esc(S.viewAs.name)+'”':''}.</b> Vetëm për lexim: asgjë nuk ruhet, nuk fshihet dhe nuk skanohet.</span><a class="btn" href="admin/" style="flex:none">‹ Kthehu te paneli</a></div></div>`:'')+subBanner0();
}
function subBanner0(){
  const d=subDays();if(d===null)return '';
  if(d<0)return `<div class="card" style="border-color:var(--bad);color:var(--bad)"><b>Abonimi skadoi më ${dmy(S.sub.expires_on)}.</b>
    <div class="small" style="color:var(--ink);margin-top:4px">Të dhënat mund t'i shohësh dhe t'i eksportosh, por nuk mund të shtosh, ndryshosh apo skanosh. Për ta rinovuar, kontakto ${SUB_CONTACT}.</div></div>`;
  if(d<=14&&S.view==='list')return `<div class="card small" style="border-color:var(--warn)"><b style="color:var(--warn)">${d===0?'Abonimi skadon sot.':'Abonimi skadon për '+d+' ditë'+(d===0?'':' (më '+dmy(S.sub.expires_on)+').')}</b> Për ta rinovuar, kontakto ${SUB_CONTACT}.</div>`;
  return '';
}
function save(v){
  if(subExpired()){toast(roMsg());return}
  const i=S.vehicles.findIndex(x=>x.id===v.id);
  if(i>=0)S.vehicles[i]=v;else S.vehicles.push(v);
  if(S.db){
    const data=JSON.parse(JSON.stringify(v));delete data.id;
    queues[v.id]=(queues[v.id]||Promise.resolve()).then(()=>S.db.doc('vehicles/'+v.id).set(data))
      .catch(e=>toast(e&&e.code==='invalid_argument'?'Nuk ke të drejtë shkrimi në këtë faqe.':'Ruajtja dështoi. Provo përsëri.'));
  }else{try{localStorage.setItem(LS,JSON.stringify(S.vehicles))}catch(e){}}
}
function remove(id){
  if(subExpired()){toast(roMsg());return}
  S.vehicles=S.vehicles.filter(x=>x.id!==id);
  if(S.db)S.db.doc('vehicles/'+id).delete().catch(()=>toast('Fshirja dështoi.'));
  else{try{localStorage.setItem(LS,JSON.stringify(S.vehicles))}catch(e){}}
}
const LSS='autosales.settings';
function saveSettings(){
  if(S.viewAs){toast(VIEW_RO);return}
  const data={default_pct:S.settings.default_pct===''?'':num(S.settings.default_pct),eur_rate:num(S.settings.eur_rate)||'',company:S.settings.company||'',nipts:ownKeys(),fiscal_on:S.settings.fiscal_on===true,sellers:JSON.parse(JSON.stringify(S.settings.sellers||{}))};
  if(S.db)S.db.doc('settings/main').set(data).catch(()=>toast('Ruajtja e Marzhit të Fitimit dështoi.'));
  else{try{localStorage.setItem(LSS,JSON.stringify(data))}catch(e){}}
}
const typing=()=>{const a=document.activeElement;return !!a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',4000)}

/* ---------- views ---------- */
function render(){
  const app=$('#app');
  if(S.view==='login')app.innerHTML=viewLogin();
  else if(S.view==='form')app.innerHTML=viewForm();
  else if(S.view==='detail')app.innerHTML=viewDetail();
  else if(S.view==='sell')app.innerHTML=viewSell();
  else if(S.view==='contract')app.innerHTML=viewContract();
  else if(S.view==='company')app.innerHTML=viewCompany();
  else if(S.view==='import')app.innerHTML=viewImport();
  else app.innerHTML=viewList();
  const sb=subBanner();if(sb)app.insertAdjacentHTML('afterbegin',sb);
  app.classList.toggle('wide',S.view==='list'&&S.tab==='report');
  if(S.view==='form')updateFormSummary();
  if(S.view==='sell')updateSellOut();

function ownKeys(){
  const sel=S.settings.sellers||{},main=S.settings.company;
  let a=Array.isArray(S.settings.nipts)?S.settings.nipts.filter((k,i,x)=>sel[k]&&x.indexOf(k)===i):[];
  if(main&&sel[main])a=[main].concat(a.filter(k=>k!==main));

}

async function doChangePass(){
  if(S.viewAs){toast('Je hyrë si administrator: fjalëkalimi yt ndërrohet nga llogaria jote, jo nga këtu.');return}
  if(!SB||S.pwBusy)return;
  const old=$('#pw-old').value,p1=$('#pw-new').value,p2=$('#pw-new2').value;
  const done=(err,msg)=>{S.pwBusy=false;S.pwErr=err||'';S.pwMsg=msg||'';if(S.view==='company')render()};
  if(!old)return done('Shkruaj fjalëkalimin e tanishëm.');
  if(p1.length<8)return done('Fjalëkalimi i ri duhet të ketë të paktën 8 shkronja ose numra.');
  if(p1!==p2)return done('Fjalëkalimet e reja nuk përputhen.');
  if(p1===old)return done('Fjalëkalimi i ri duhet të jetë i ndryshëm nga i tanishmi.');
  S.pwBusy=true;S.pwErr='';S.pwMsg='';render();
  try{
    let mail=S.userMail;
    if(!mail){const {data}=await SB.auth.getUser();mail=data&&data.user&&data.user.email;S.userMail=mail||''}
    if(!mail)return done('Llogaria nuk u gjet. Dil dhe hyr përsëri.');
    const chk=await SB.auth.signInWithPassword({email:mail,password:old});
    if(chk.error)return done(/invalid/i.test(chk.error.message||'')?'Fjalëkalimi i tanishëm nuk është i saktë.':'Nuk u kontrollua dot fjalëkalimi. Provo përsëri.');

async function downloadContract(print){

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function pdfFirstPage(file){
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  if(!window.pdfjsLib){await loadScript(base+'pdf.min.js');await loadScript(base+'pdf.worker.min.js')}
  const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const pg=await pdf.getPage(1),vp=pg.getViewport({scale:2.2}),c=document.createElement('canvas');
  c.width=Math.round(vp.width);c.height=Math.round(vp.height);
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:ctx,viewport:vp}).promise;
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('pdf')),'image/jpeg',.92));
}
async function prepImages(files,maxCount){
  const out=[],split=files.length*2<=maxCount;
  for(const f of files){
    let bmp=null;try{bmp=await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){}
    if(!bmp||!split||bmp.height<bmp.width*1.15){out.push(f);continue}
    for(const [a,b] of [[0,.56],[.44,1]]){
      const c=document.createElement('canvas'),h=Math.round(bmp.height*(b-a));c.width=bmp.width;c.height=h;
      c.getContext('2d').drawImage(bmp,0,Math.round(bmp.height*a),bmp.width,h,0,0,bmp.width,h);
      const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));
      if(blob)out.push(blob);
    }
  }
  return out.length?out:files;
}
const SCAN_ERR={scan_disabled:'Skanimi nuk është pjesë e abonimit tuaj. Plotëso fushat me dorë.',no_key:'Skanimi nuk është aktivizuar ende në server. Plotëso fushat me dorë.',not_granted:'Skanimi nuk u lejua. Plotëso fushat me dorë.',rate_limited:'Shumë kërkesa. Provo pas pak.',image_rejected:'Fotoja nuk u pranua. Provo një foto tjetër (JPEG ose PNG).',
  images_unavailable:'Kjo pamje nuk dërgon dot foto. Plotëso fushat me dorë.',refused:'Dokumenti nuk u lexua. Provo një foto më të qartë.',invalid_json:'Leximi doli i paqartë. Provo përsëri me foto më të afërt.',
  session_expired:'Hyr përsëri në Claude dhe provo.',sampling_disabled:'Skanimi nuk është i disponueshëm për këtë llogari.'};
async function runScan(fileList){
  let files=[...fileList].slice(0,(S.imgLimits&&S.imgLimits.maxCount)||2);
  if(!files.length||!S.sample)return;
  if(files.some(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name||''))){
    S.scan={busy:true,msg:'Po hapet PDF-ja…',err:''};render();
    try{files=await Promise.all(files.map(f=>(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name||''))?pdfFirstPage(f):f))}
    catch(e){S.scan={busy:false,msg:'',err:'PDF-ja nuk u hap. Dërgoje si foto ose plotëso fushat me dorë.'};render();return}
  }
  S.scan={busy:true,msg:'Po përgatiten fotot…',err:''};render();
  scanCtl=new AbortController();
  try{
    const imgs=await prepImages(files,(S.imgLimits&&S.imgLimits.maxCount)||1);
    S.scan.msg='Po lexohet dokumenti. Zgjat deri në një minutë.';render();
    const r=await S.sample.json(PROMPT,{images:imgs,signal:scanCtl.signal,cache:false});
    applyScan(r&&typeof r==='object'?r:{});
    S.scan={busy:false,msg:'',err:S.auto.size?(niptMismatch(S.draft)?niptMismatch(S.draft)+' Kontrollo nëse ke skanuar fletën e duhur.':''):'Nuk u lexua asnjë fushë. Provo me foto më të afërt dhe të drejtë.'};
  }catch(e){
    S.scan={busy:false,msg:'',err:e&&e.code==='cancelled'?'':(SCAN_ERR[e&&e.code]||'Leximi dështoi. Provo përsëri.')};
  }
  render();
}
function applyScan(r){
  const d=S.draft,set=(k,v)=>{if(v===null||v===undefined||v==='')return;d[k]=v;S.auto.add(k)};
  const local=r.doc_type==='invoice'||(!r.decl_no&&!!r.nivf);
  if(local){d.source='local';d.regime='';for(const k of ['decl_no','decl_date','customs_office','adjustment','customs_value','freight_all'])delete d[k]}
  else if(r.doc_type==='customs'||r.decl_no)d.source='import';
  for(const k of ['supplier','supplier_country','importer','importer_nipt','customs_office','decl_no','make_model','fuel','invoice_no','color','nivf'])set(k,r[k]&&String(r[k]).trim());
  for(const k of ['supplier_nipt','plate'])if(r[k])set(k,String(r[k]).toUpperCase().replace(/[^A-Z0-9]/g,''));
  for(const k of ['decl_date','invoice_date'])if(/^\d{4}-\d{2}-\d{2}$/.test(r[k]||''))set(k,r[k]);
  for(const k of ['freight_all','invoice_value','rate','engine_cc','year','adjustment','customs_value'])if(r[k]!==null&&r[k]!==undefined&&num(r[k]))set(k,num(r[k]));
  if(num(d.adjustment)>=10){const base=num(d.invoice_value)*num(d.rate)+num(d.freight_all),g=base>0&&num(d.customs_value)>0?num(d.customs_value)/base:0;d.adjustment=g>0.5&&g<10?Math.round(g*1000)/1000:num(d.adjustment)/1000}
  if(r.currency)set('currency',String(r.currency).toUpperCase().slice(0,3));
  if(r.regime&&!local){set('regime',String(r.regime).toUpperCase().replace(/[^A-Z0-9]/g,''));if(d.regime==='IM7')toast('Kjo deklaratë është IM7, magazinë doganore. Për shitje duhet IM4.')}
  if(r.vin)set('vin',String(r.vin).toUpperCase().replace(/[^A-Z0-9]/g,''));
  if(!num(d.invoice_value)&&num(r.invoice_price))set('invoice_value',num(r.invoice_price));
  if(local){
    if(d.currency==='ALL')delete d.rate;
    d.vat=num(r.invoice_vat_all);d.duty=0;d.other_fees=0;
    const base=num(d.invoice_value)*(d.currency==='ALL'?1:num(d.rate));if(base>0){d.tax_base=Math.round(base*100)/100;S.auto.add('tax_base')}
    ['vat','source'].forEach(k=>S.auto.add(k));return;
  }
  const tx=Array.isArray(r.taxes)?r.taxes:[];
  if(tx.length||r.grand_total){
    const amt=re=>tx.filter(t=>re.test(String(t.code||''))).reduce((a,t)=>a+num(t.amount),0);
    const duty=amt(/^DOG/i),vat=amt(/^TV/i),rest=tx.filter(t=>!/^(DOG|TV)/i.test(String(t.code||''))).reduce((a,t)=>a+num(t.amount),0);
    const grand=num(r.grand_total),tvs=tx.find(t=>/^TV/i.test(String(t.code||'')));if(tvs&&num(tvs.base))set('tax_base',num(tvs.base));
    const unpaid=grand>0&&vat>0&&grand<vat;
    d.duty=duty;d.vat=unpaid?0:vat;d.other_fees=grand>0&&grand>=duty+vat?grand-duty-vat:rest+num(r.fees_total);
    if(unpaid)toast('Sipas fletës, TVSH-ja nuk është paguar në doganë. U la zero.');
    ['duty','vat','other_fees'].forEach(k=>S.auto.add(k));
  }
}

const impCell=v=>{if(v==null)return '';if(v instanceof Date)return v;if(typeof v==='object'){if(v.result!==undefined)return impCell(v.result);if(v.text!==undefined)return String(v.text);if(Array.isArray(v.richText))return v.richText.map(x=>x.text).join('');return ''}return v};
const impDate=v=>{if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);const t=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}/.test(t))return t.slice(0,10);return parseDmy(t)||''};
// Një rresht i lexuar (nga Excel-i ose nga skanimi) kthehet në mjet gati për t'u ruajtur, me paralajmërimet e veta.
function impFinish(d,label){
  const warn=[],ks=ownKeys();

  let err='';

  else if(d.vin&&S.vehicles.some(x=>x.vin&&x.vin===d.vin))err='Kjo shasi është tashmë në program.';
  else if(d.vin&&S.imp.rows.some(r=>!r.err&&r.d.vin===d.vin))err='Kjo shasi përsëritet në këtë import.';
  if(!num(d.invoice_value))warn.push('pa vlerë blerjeje');
  if(d.currency&&d.currency!=='ALL'&&!num(d.rate))warn.push('pa kurs');
  if(d.regime==='IM7')warn.push('IM7, magazinë doganore');
  const nm=niptMismatch(d);if(nm)warn.push('NIPT i huaj');
  if(ks.length>1)d.owner=autoOwner(d);else delete d.owner;
  const oc=ownerCompany(d)||{};if(!d.importer&&(!d.importer_nipt||String(d.importer_nipt).toUpperCase()===String(oc.nipt||'').toUpperCase())){d.importer=oc.name||'';if(!d.importer_nipt&&oc.nipt)d.importer_nipt=oc.nipt}

// Çdo skedar (PDF ose foto) është një dokument blerjeje dhe bëhet një mjet. Lexohen njëri pas tjetrit.
async function impScan(fileList){
  if(S.imp.busy||!S.sample)return;
  let files=[...fileList];if(!files.length)return;
  if(files.length>IMP_MAX_SCAN){toast('U morën '+IMP_MAX_SCAN+' skedarët e parë. Pjesën tjetër ngarkoje pas kësaj.');files=files.slice(0,IMP_MAX_SCAN)}
  S.imp.busy=true;S.imp.stop=false;
  for(let i=0;i<files.length&&!S.imp.stop;i++){
    const f=files[i],label=f.name||('Skedari '+(i+1));S.imp.msg=`Po lexohet ${i+1} nga ${files.length}: ${label}`;render();
    try{
      const img=(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name||''))?await pdfFirstPage(f):f;
      const imgs=await prepImages([img],(S.imgLimits&&S.imgLimits.maxCount)||1);
      const r=await S.sample.json(PROMPT,{images:imgs,cache:false});
      const keepD=S.draft,keepA=S.auto;S.draft=newDraft();S.draft.id+=i;S.auto=new Set();
      applyScan(r&&typeof r==='object'?r:{});const d=S.draft,got=S.auto.size;S.draft=keepD;S.auto=keepA;
      S.imp.rows.push(got?impFinish(d,label):{d,label,err:'Nuk u lexua asnjë fushë nga ky dokument.',warn:[]});
    }catch(e){
      S.imp.rows.push({d:newDraft(),label,err:SCAN_ERR[e&&e.code]||'Leximi dështoi.',warn:[]});
      if(e&&['scan_disabled','no_key','forbidden','sampling_disabled','session_expired'].includes(e.code))break;
    }
  }
  S.imp.busy=false;S.imp.msg='';S.imp.stop=false;render();
}

/* ---------- city suggestions ---------- */
const plain=s=>String(s||'').toLowerCase().replace(/ë/g,'e').replace(/ç/g,'c');
let cityOpts=[],cityIdx=-1;
function cityShow(){
  const inp=$('#s-city'),box=$('#citylist');if(!inp||!box)return;
  const q=plain(inp.value.trim()),all=[...new Set(S.vehicles.map(x=>x.sale&&x.sale.city).filter(Boolean).concat(CITIES))];
  cityOpts=(q?all.filter(c=>plain(c).startsWith(q)).concat(all.filter(c=>!plain(c).startsWith(q)&&plain(c).includes(q))):all).slice(0,8);
  if(cityOpts.length===1&&plain(cityOpts[0])===q&&cityOpts[0]===inp.value.trim())cityOpts=[];
  if(cityIdx>=cityOpts.length)cityIdx=cityOpts.length-1;
  box.hidden=!cityOpts.length;inp.setAttribute('aria-expanded',String(!!cityOpts.length));
  box.innerHTML=cityOpts.map((c,i)=>`<div role="option" data-city="${esc(c)}" class="${i===cityIdx?'on':''}" aria-selected="${i===cityIdx}">${esc(c)}</div>`).join('');
  const on=box.querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'});
}
function cityHide(){const box=$('#citylist'),inp=$('#s-city');if(box)box.hidden=true;if(inp)inp.setAttribute('aria-expanded','false');cityIdx=-1}
function cityPick(c){const inp=$('#s-city');if(!inp)return;inp.value=c;if(S.sale)S.sale.city=c;cityHide()}
document.addEventListener('keydown',e=>{
  if(e.target.id!=='s-city')return;
  const open=!$('#citylist').hidden;
  if(e.key==='ArrowDown'){e.preventDefault();if(!open){cityIdx=0;cityShow()}else{cityIdx=(cityIdx+1)%cityOpts.length;cityShow()}}
  else if(e.key==='ArrowUp'){e.preventDefault();if(open){cityIdx=(cityIdx-1+cityOpts.length)%cityOpts.length;cityShow()}}
  else if(e.key==='Enter'&&open){e.preventDefault();cityPick(cityOpts[cityIdx<0?0:cityIdx])}
  else if(e.key==='Tab'&&open&&cityIdx>=0){cityPick(cityOpts[cityIdx])}
  else if(e.key==='Escape'&&open){e.preventDefault();cityHide()}
});
document.addEventListener('keydown',e=>{
  if(e.target.id!=='s-date')return;
  if(e.key==='ArrowDown'){e.preventDefault();openCal()}
  else if(e.key==='Tab'||e.key==='Enter'){if(e.key==='Enter'){e.preventDefault();const d=parseDmy(e.target.value);if(d)S.sale.date=d;e.target.value=longDate(S.sale.date)}S.cal.open=false;refreshCal()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.cal.open&&S.view==='sell'){S.cal.open=false;refreshCal()}});
document.addEventListener('mousedown',e=>{const o=e.target.closest&&e.target.closest('[data-city]');if(o){e.preventDefault();cityPick(o.dataset.city)}});
document.addEventListener('focusin',e=>{if(e.target.id==='s-city'){cityIdx=-1;cityShow()}});
document.addEventListener('focusout',e=>{if(e.target.id==='s-city')cityHide()});

  }

    <div class="small muted">Instaloje që të hapet si program më vete, nga ekrani kryesor ose nga desktopi. Versioni ${APP_VERSION}.</div>

}

function loginMode(m){S.loginMode=m;S.loginErr='';S.loginMsg='';S.loginSent='';const el=$('#l-mail');if(el)S.loginMail=el.value.trim();render()}
function authRedirect(){return location.origin+location.pathname}
async function doLogin(){
  if(!SB||S.loginBusy)return;
  const email=$('#l-mail').value.trim(),password=$('#l-pass').value;
  if(!email||!password){S.loginErr='Shkruaj emailin dhe fjalëkalimin.';S.loginMail=email;render();return}
  S.loginBusy=true;S.loginErr='';S.loginMsg='';S.loginMail=email;render();
  const {error}=await SB.auth.signInWithPassword({email,password});
  S.loginBusy=false;
  if(error){
    if(/not confirmed/i.test(error.message)){S.loginSent=email;S.loginErr='Emaili nuk është konfirmuar ende.';render();return}
    S.loginErr=/invalid/i.test(error.message)?'Emaili ose fjalëkalimi nuk është i saktë.':'Hyrja dështoi. Provo përsëri.';render();return}
  startSupabase();
}
async function doSignup(){
  if(!SB||S.loginBusy)return;
  const email=$('#l-mail').value.trim(),password=$('#l-pass').value,p2=$('#l-pass2').value;
  S.loginMail=email;S.loginMsg='';
  const fail=m=>{S.loginErr=m;render()};
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return fail('Shkruaj një email të saktë.');
  if(password.length<8)return fail('Fjalëkalimi duhet të ketë të paktën 8 shkronja ose numra.');
  if(password!==p2)return fail('Fjalëkalimet nuk përputhen.');
  S.loginBusy=true;S.loginErr='';render();
  const {data,error}=await SB.auth.signUp({email,password,options:{emailRedirectTo:authRedirect()}});
  S.loginBusy=false;
  if(error){
    const m=error.message||'';
    return fail(/already|registered/i.test(m)?'Ky email ka tashmë llogari. Hyr me të.'
      :/signups? (not allowed|disabled)/i.test(m)?'Krijimi i llogarive të reja është i mbyllur për momentin.'
      :/rate|too many|seconds/i.test(m)?'U dërguan shumë emaile. Prit pak minuta dhe provo përsëri.'
      :/password/i.test(m)?'Fjalëkalimi është shumë i dobët. Zgjidh një më të gjatë.'
      :'Llogaria nuk u krijua. Provo përsëri.');
  }
  if(data&&data.session){S.loginMode='login';startSupabase();return}
  // Emaili ka tashmë llogari të konfirmuar: Supabase kthen përdorues pa identitete dhe nuk dërgon email.
  if(data&&data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length){S.loginMode='login';S.loginErr='';S.loginMsg='Ky email ka tashmë llogari. Hyr me fjalëkalimin tënd.';render();return}
  // Supabase nuk tregon nëse emaili ekziston: përdoruesi sheh të njëjtin mesazh në të dyja rastet.
  S.loginSent=email;render();
}
async function doForgot(){
  if(!SB||S.loginBusy)return;
  const email=$('#l-mail').value.trim();S.loginMail=email;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){S.loginErr='Shkruaj një email të saktë.';render();return}
  S.loginBusy=true;S.loginErr='';render();
  const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:authRedirect()});
  S.loginBusy=false;
  if(error){S.loginErr=/rate|too many|seconds/i.test(error.message||'')?'U dërguan shumë emaile. Prit pak minuta dhe provo përsëri.':'Emaili nuk u dërgua. Provo përsëri.';render();return}
  S.loginMsg='Nëse ky email ka llogari, i dërguam një link për të vendosur fjalëkalim të ri. Shiko edhe te Spam.';render();
}
async function doNewPass(){
  if(!SB||S.loginBusy)return;
  const password=$('#l-pass').value,p2=$('#l-pass2').value;
  const fail=m=>{S.loginErr=m;render()};
  if(password.length<8)return fail('Fjalëkalimi duhet të ketë të paktën 8 shkronja ose numra.');
  if(password!==p2)return fail('Fjalëkalimet nuk përputhen.');
  S.loginBusy=true;S.loginErr='';render();
  const {error}=await SB.auth.updateUser({password});
  S.loginBusy=false;
  if(error)return fail(/different|same/i.test(error.message||'')?'Zgjidh një fjalëkalim të ndryshëm nga i vjetri.':/session|jwt|auth/i.test(error.message||'')?'Linku ka skaduar. Kërko një link të ri te “Harrova fjalëkalimin”.':'Fjalëkalimi nuk u ruajt. Provo përsëri.');
  S.loginMode='login';startSupabase();
}
async function doResend(){
  if(!SB||S.loginBusy||!S.loginSent)return;
  S.loginBusy=true;S.loginErr='';S.loginMsg='';render();
  const {error}=await SB.auth.resend({type:'signup',email:S.loginSent,options:{emailRedirectTo:authRedirect()}});
  S.loginBusy=false;S.loginErr=error?'Emaili nuk u dërgua. Prit një minutë dhe provo përsëri.':'';S.loginMsg=error?'':'U dërgua përsëri.';render();
}
// Nëse serveri thotë se sesioni s'ekziston më, signOut nuk e fshin kopjen lokale: e fshijmë vetë.
function clearLocalSession(){try{Object.keys(localStorage).filter(k=>/^sb-.*-auth-token/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(e){}}
async function doLogout(){try{await SB.auth.signOut({scope:'local'})}catch(e){}clearLocalSession();location.reload()}
function supaDb(sb,cid){
  const subs=[];let pending=0;
  const snap=(id,row)=>({id,exists:!!row,data:()=>row?row.data:undefined});
  async function load(s){
    try{
      if(s.t==='col'){const {data,error}=await sb.from('vehicles').select('id,data').eq('company_id',cid);if(error)throw error;
        if(!pending)s.cb({docs:data.map(r=>snap(r.id,r))})}
      else if(s.col==='settings'){const {data,error}=await sb.from('settings').select('data').eq('company_id',cid).maybeSingle();if(error)throw error;if(!pending)s.cb(snap(s.id,data))}
      else if(s.col==='rates'){const {data,error}=await sb.from('rates').select('data').eq('source',s.id).maybeSingle();if(error)throw error;s.cb(snap(s.id,data))}
    }catch(e){console.error(e)}
  }
  const sub=s=>{subs.push(s);load(s);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}};
  const refresh=()=>{if(!pending&&document.visibilityState==='visible')subs.forEach(load)};
  setInterval(refresh,60000);document.addEventListener('visibilitychange',refresh);
  const fail=error=>({code:error&&(error.code==='42501'||error.code==='PGRST301')?'invalid_argument':'unavailable',message:error&&error.message});
  return {
    collection(name){return {onSnapshot:(cb,err)=>sub({t:'col',name,cb,err})}},
    doc(path){const [col,id]=path.split('/');return {
      onSnapshot:(cb,err)=>sub({t:'doc',col,id,cb,err}),
      async set(data){pending++;try{
        const q=col==='vehicles'?sb.from('vehicles').upsert({company_id:cid,id,data}):col==='settings'?sb.from('settings').upsert({company_id:cid,data}):null;
        if(!q)throw {code:'invalid_argument'};const {error}=await q;if(error)throw fail(error)}finally{pending--}},
      async delete(){pending++;try{const {error}=await sb.from('vehicles').delete().eq('company_id',cid).eq('id',id);if(error)throw fail(error)}finally{pending--}}}}
  };
}
function supaScan(sb){
  async function b64(blob){
    let bmp=null;try{bmp=await createImageBitmap(blob,{imageOrientation:'from-image'})}catch(e){}
    if(bmp){const k=Math.min(1,2000/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
      c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return {media_type:'image/jpeg',data:c.toDataURL('image/jpeg',.9).split(',')[1]}}
    const buf=new Uint8Array(await blob.arrayBuffer());let s='';for(let i=0;i<buf.length;i+=32768)s+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));
    return {media_type:blob.type||'image/jpeg',data:btoa(s)};
  }
  return {
    async json(prompt,o={}){
      const images=[];for(const f of [].concat(o.images||[]))images.push(await b64(f));
      const {data,error}=await sb.functions.invoke('scan',{body:{prompt,images}});
      if(o.signal&&o.signal.aborted)throw {code:'cancelled'};
      if(error){let code='upstream_error';try{const j=await error.context.json();if(j&&j.code)code=j.code}catch(e){}throw {code}}
      if(!data||data.result===undefined||data.result===null)throw {code:'invalid_json'};
      return data.result;
    },
    async limits(){return {images:{maxCount:4,mediaTypes:['image/jpeg','image/png','image/webp']}}}
  };
}
async function bootSupabase(cfg){
  try{
    if(!window.supabase)await loadScript(cfg.sdk||'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');
    SB=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);
    const badLink=/error(_code|_description)?=/.test(location.hash+location.search);
    const recovery=/type=recovery/.test(location.hash+location.search);
    const {data}=await SB.auth.getSession();
    if(location.hash.includes('access_token')||badLink||/[?&]code=/.test(location.search))history.replaceState(null,'',location.pathname);
    if(!data.session&&/[?&]signup\b/.test(location.search)){S.loginMode='signup';history.replaceState(null,'',location.pathname)}
    if(!data.session){S.view='login';if(badLink)S.loginErr='Linku i konfirmimit ka skaduar ose është përdorur. Hyr, ose kërko një link të ri.';render();return}
    if(recovery){S.view='login';S.loginMode='newpass';render();return}
  }catch(e){S.view='login';S.loginErr='Nuk u lidh dot me serverin. Kontrollo internetin dhe rifresko faqen.';render();return}
  startSupabase();
}
async function startSupabase(){
  S.view='list';S.loaded=false;S.slow=false;render();
  const timer=setTimeout(()=>{if(!S.loaded){S.slow=true;if(S.view==='list')render()}},10000);
  try{const u=await SB.auth.getSession();S.userMail=(u.data.session&&u.data.session.user&&u.data.session.user.email)||''}catch(e){}
  let cid,error;
  // ?shiko=<id e kompanisë>: vetëm administratori, vetëm lexim. Për këdo tjetër parametri shpërfillet.
  const as=(location.search.match(/[?&]shiko=([0-9a-f-]{36})\b/i)||[])[1];
  if(as){const r=await SB.rpc('admin_open_company',{p_company:as});
    if(!r.error&&r.data){cid=as;S.viewAs={id:as,name:r.data.name||r.data.nipt||''};S.onboardChecked=true}
    else history.replaceState(null,'',location.pathname)}
  if(!cid){const r=await SB.rpc('ensure_company');cid=r.data;error=r.error}
  if(error||!cid){clearTimeout(timer);S.view='login';S.loginErr='Hyrja u krye, por kompania nuk u ngarkua. Provo përsëri.';render();return}
  const loadSub=async()=>{try{const {data,error}=await SB.from('subscriptions').select('plan,price,currency,expires_on').eq('company_id',cid).maybeSingle();
    if(!error){const was=JSON.stringify(S.sub||null);S.sub=data||null;if(was!==JSON.stringify(S.sub)&&(S.view==='list'||S.view==='company'))render()}}catch(e){}};
  if(!S.viewAs)loadFiscal();
  S.loadSub=loadSub;loadSub();setInterval(loadSub,15*60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadSub()});
  S.sample=supaScan(SB);if(S.viewAs)S.sample.json=async()=>{throw {code:'scan_disabled'}};S.imgLimits=(await S.sample.limits()).images;
  attachDb(supaDb(SB,cid),timer);
}
// Llogari e re (pa kompani dhe pa mjete): hapet njëherë Settings për emrin, NIPT-in dhe adresën.
function maybeOnboard(){
  if(!SB||S.onboardChecked||!S.loaded||!S.settingsLoaded)return;
  S.onboardChecked=true;
  if(!mainCompany()&&S.view==='list'){S.onboard=true;S.view='company';render()}
}
function attachDb(db,timer){
    S.db=db;
    db.collection('vehicles').onSnapshot(snap=>{
      clearTimeout(timer);S.loaded=true;S.slow=false;
      S.vehicles=snap.docs.map(d=>Object.assign(JSON.parse(JSON.stringify(d.data()||{})),{id:d.id}));
      if(S.view!=='form'&&S.view!=='sell'&&S.view!=='contract'&&S.view!=='company'&&!typing()){render();if(S.view==='detail')updatePricingOut()}
      else if(S.view==='list')updateList();
      maybeOnboard();
    },()=>{clearTimeout(timer);S.loaded=true;if(S.view==='list')render()});
    db.doc('rates/boa').onSnapshot(d=>{S.boa=d.exists?JSON.parse(JSON.stringify(d.data()||{})):null;
      if(!typing()&&(S.view==='company'||S.view==='detail')){render();if(S.view==='detail')updatePricingOut()}},()=>{});
    db.doc('settings/main').onSnapshot(d=>{
      if(typing()&&(document.activeElement.id==='std'||S.view==='contract'||S.view==='company'))return;
      S.settings=Object.assign({default_pct:'',sellers:{}},d.exists?JSON.parse(JSON.stringify(d.data()||{})):{});
      if(S.view==='list'){if(typing())updateList();else render()}
      else if(S.view==='detail'&&!typing()){render();updatePricingOut()}
      if(!S.settingsLoaded&&fiscalOn())loadFiscal();
      S.settingsLoaded=true;maybeOnboard();
    },()=>{});
}

/* ---------- boot ---------- */
async function boot(){
  const cfg=window.AUTOSALES_CONFIG;
  render();
  if(!(window.claude&&window.claude.use)&&cfg&&cfg.supabaseUrl){S.sample=undefined;return bootSupabase(cfg)}
  const timer=setTimeout(()=>{if(!S.loaded){S.slow=true;if(S.view==='list')render()}},10000);
  let db=null;
  if(window.claude&&window.claude.use){
    window.claude.use('sample').then(async s=>{
      if(!s){S.sample=undefined;return}
      S.sample=s;try{const l=await s.limits();S.imgLimits=l.images||null}catch(e){S.imgLimits=null}
      if(S.view==='form'&&!typing())render();
    }).catch(()=>{S.sample=undefined});
    try{db=await window.claude.use('db')}catch(e){db=null}
  }else S.sample=undefined;
  if(db){attachDb(db,timer);
  }else{clearTimeout(timer);S.loaded=true;loadLocal();if(S.view==='list')render()}
}
boot();
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='l-pass2'){S.loginMode==='newpass'?doNewPass():doSignup()}else if(e.target.id==='l-mail'&&S.loginMode==='forgot')doForgot();else if(e.target.id==='l-pass'&&S.loginMode!=='signup'&&S.loginMode!=='newpass')doLogin()});
if('serviceWorker' in navigator&&!(window.claude&&window.claude.use)&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
